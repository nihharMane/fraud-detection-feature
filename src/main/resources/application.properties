spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

server.port=${PORT:8081}

spring.application.name=payment-validation-service
validator.rule.name=Duplicate_Txn_Validator,Fraud_Check_Validator
logging.level.org.springframework.security=TRACE

# Fraud detection
fraud.velocity.max-txn-per-hour=5
fraud.threshold.medium=30
fraud.threshold.high=70

# AI Configuration
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=llama-3.1-8b-instant

spring.data.redis.host=localhost
spring.data.redis.port=6379

# stripe.provider.url=https://stripe-provider-service-4w98.onrender.com
stripe.provider.url=http://localhost:8083
stripe.provider.payment-path=/v1/payments


# Circuit Breaker configuration for Stripe Provider
resilience4j.circuitbreaker.instances.stripeProvider.registerHealthIndicator=false

# Track the last 10 calls
resilience4j.circuitbreaker.instances.stripeProvider.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.stripeProvider.slidingWindowSize=10

# At least 5 calls are required before calculating failure rate
resilience4j.circuitbreaker.instances.stripeProvider.minimumNumberOfCalls=5

# Open the circuit when 50% of recorded calls fail
resilience4j.circuitbreaker.instances.stripeProvider.failureRateThreshold=50

# Wait 10 seconds before testing recovery
resilience4j.circuitbreaker.instances.stripeProvider.waitDurationInOpenState=10s

# Allow 2 test calls in HALF_OPEN state
resilience4j.circuitbreaker.instances.stripeProvider.permittedNumberOfCallsInHalfOpenState=2

# Automatically transition from OPEN to HALF_OPEN
resilience4j.circuitbreaker.instances.stripeProvider.automaticTransitionFromOpenToHalfOpenEnabled=true

# Retry configuration for Stripe Provider
resilience4j.retry.instances.stripeProviderRetry.maxAttempts=3
resilience4j.retry.instances.stripeProviderRetry.waitDuration=1s
resilience4j.retry.instances.stripeProviderRetry.enableExponentialBackoff=true
resilience4j.retry.instances.stripeProviderRetry.exponentialBackoffMultiplier=2

# JWT configuration
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=900000

jwt.refresh-expiration-ms=604800000